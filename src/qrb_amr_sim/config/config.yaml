# MoveIt Pro robot configuration package for Qualcomm's QRB robot base, ported from qrb_ros_samples'
# simulation_sample_amr_simple_motion. Controller, joint, and topic names follow lunar_sim, the diff-drive reference.
runtime_launch_file:
  package: "qrb_amr_sim"
  path: "launch/runtime.launch.xml"

hardware:
  launch_control_node: True
  launch_robot_state_publisher: True
  robot_description:
    urdf:
      package: "qrb_amr_sim"
      path: "description/qrb_robot_base.urdf.xacro"
    srdf:
      package: "qrb_amr_sim"
      path: "config/moveit/qrb_robot_base.srdf"
    urdf_params:
      - mujoco_model: "description/scene.xml"
      - mujoco_viewer: "false"
  additional_driver_launch_file:
    package: "qrb_amr_sim"
    path: "launch/simple_motion_drivers.launch.py"

ros_global_params:
  use_sim_time: False

moveit_params:
  joint_group_name: "base"
  kinematics:
    package: "qrb_amr_sim"
    path: "config/moveit/kinematics.yaml"
  pose_jog:
    package: "qrb_amr_sim"
    path: "config/moveit/pose_jog.yaml"
  joint_jog:
    package: "qrb_amr_sim"
    path: "config/moveit/joint_jog.yaml"
  publish:
    planning_scene: True
    geometry_updates: True
    state_updates: True
    transforms_updates: True

ros2_control:
  config:
    package: "qrb_amr_sim"
    path: "config/control/qrb_robot_base.ros2_control.yaml"
  controllers_active_at_startup:
    - "joint_state_broadcaster"
    - "platform_velocity_controller"
  # Qualcomm's simple_motion node publishes Twist on /qrb_robot_base/cmd_vel (its Gazebo launch used
  # namespace:=qrb_robot_base); TeleoperateBase publishes TwistStamped on /cmd_vel.
  controller_shared_topics:
    /cmd_vel:
      - "/platform_velocity_controller/cmd_vel"
    /odom:
      - "/platform_velocity_controller/odom"

objectives:
  behavior_loader_plugins:
    core:
      - "moveit_pro::behaviors::CoreBehaviorsLoader"
      - "moveit_pro::behaviors::MTCCoreBehaviorsLoader"
      - "moveit_pro::behaviors::ConverterBehaviorsLoader"
      - "moveit_pro::behaviors::MujocoBehaviorsLoader"
      # Reset MuJoCo Sim calls ClearSnapshot, a vision Behavior.
      - "moveit_pro::behaviors::VisionBehaviorsLoader"
    lunar_sim:
      - "lunar_sim_behaviors::LunarSimBehaviorsLoader"
  objective_library_paths:
    core_objectives:
      package_name: "moveit_pro_objectives"
      relative_path: "objectives/core"
    mujoco_objectives:
      package_name: "moveit_pro_objectives"
      relative_path: "objectives/mujoco"
    qrb_amr_objectives:
      package_name: "qrb_amr_sim"
      relative_path: "objectives"
  waypoints_file:
    package_name: "qrb_amr_sim"
    relative_path: "waypoints/waypoints.yaml"
