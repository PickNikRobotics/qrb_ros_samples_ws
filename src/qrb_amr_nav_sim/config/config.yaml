# MoveIt Pro robot configuration package for Qualcomm's QRB robot base mini, ported from qrb_ros_samples'
# simulation_amr_navigation (Cartographer 2D lidar SLAM plus Nav2). Controller, joint, and topic names follow
# lunar_sim, the diff-drive reference; the Nav2 wiring follows hangar_sim.
runtime_launch_file:
  package: "qrb_amr_nav_sim"
  path: "launch/runtime.launch.xml"

hardware:
  launch_control_node: True
  launch_robot_state_publisher: True
  robot_description:
    urdf:
      package: "qrb_amr_nav_sim"
      path: "description/qrb_robot_base_mini.urdf.xacro"
    srdf:
      package: "qrb_amr_nav_sim"
      path: "config/moveit/qrb_robot_base_mini.srdf"
    urdf_params:
      - mujoco_model: "description/scene.xml"
      - mujoco_viewer: "false"

  # The sample's SLAM and navigation, started with the drivers as the README starts them next to Gazebo.
  additional_driver_launch_file:
    package: "qrb_amr_nav_sim"
    path: "launch/navigation_drivers.launch.py"

ros_global_params:
  use_sim_time: False

moveit_params:
  joint_group_name: "base"
  kinematics:
    package: "qrb_amr_nav_sim"
    path: "config/moveit/kinematics.yaml"
  pose_jog:
    package: "qrb_amr_nav_sim"
    path: "config/moveit/pose_jog.yaml"
  joint_jog:
    package: "qrb_amr_nav_sim"
    path: "config/moveit/joint_jog.yaml"
  publish:
    planning_scene: True
    geometry_updates: True
    state_updates: True
    transforms_updates: True

ros2_control:
  config:
    package: "qrb_amr_nav_sim"
    path: "config/control/qrb_robot_base_mini.ros2_control.yaml"
  controllers_active_at_startup:
    - "joint_state_broadcaster"
    - "platform_velocity_controller"
  # Nav2 and TeleoperateBase both publish TwistStamped on /cmd_vel; Nav2 and Cartographer read /odom.
  controller_shared_topics:
    /cmd_vel:
      - "/platform_velocity_controller/cmd_vel"
    /odom:
      - "/platform_velocity_controller/odom"

objectives:
  behavior_loader_plugins:
    core:
      - "moveit_pro::behaviors::CoreBehaviorsLoader"
      - "moveit_pro::behaviors::MTCCoreBehaviorsLoader"
      - "moveit_pro::behaviors::ConverterBehaviorsLoader"
      - "moveit_pro::behaviors::NavBehaviorsLoader"
      - "moveit_pro::behaviors::MujocoBehaviorsLoader"
      # Reset MuJoCo Sim calls ClearSnapshot, a vision Behavior.
      - "moveit_pro::behaviors::VisionBehaviorsLoader"
    lunar_sim:
      - "lunar_sim_behaviors::LunarSimBehaviorsLoader"
  objective_library_paths:
    core_objectives:
      package_name: "moveit_pro_objectives"
      relative_path: "objectives/core"
    mujoco_objectives:
      package_name: "moveit_pro_objectives"
      relative_path: "objectives/mujoco"
    qrb_amr_nav_objectives:
      package_name: "qrb_amr_nav_sim"
      relative_path: "objectives"
  waypoints_file:
    package_name: "qrb_amr_nav_sim"
    relative_path: "waypoints/waypoints.yaml"
